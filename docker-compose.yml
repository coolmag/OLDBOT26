services:
  bot:
    build: .
    container_name: aurorabot
    restart: always
    ports:
      - "8080:8080"
    environment:
      - BOT_TOKEN=${BOT_TOKEN}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - PLAYER_URL=${PLAYER_URL}
      - WEBHOOK_URL=${WEBHOOK_URL}
      - REDIS_URL=${REDIS_URL}
      - DB_PATH=/app/data/bot.db
    volumes:
      - ./data:/app/data
      - ./downloads:/app/downloads
